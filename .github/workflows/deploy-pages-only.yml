name: Deploy Pages Only (no data fetch)

# 仅部署当前仓库内容到 GitHub Pages，不运行 fetch-data.mjs
# 用途：手动触发 Pages 重新部署，让最新的 data/ 文件生效

on:
  workflow_dispatch:  # 仅手动触发
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'index.html'
      - 'static/**'
      - 'CNAME'
      - '.nojekyll'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
