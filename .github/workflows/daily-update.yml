name: Daily Stock Data Update

on:
  # ====== 外部定时触发（cron-job.org 精准触发，无延迟）======
  # 两阶段推送（详见 phase 参数）：
  #   preview 阶段：工作日 北京时间 17:00 (UTC 09:00 / KST 18:00) — 收盘后抓取+部署，推给 B 预览群
  #   final   阶段：次日 工作日 北京时间 10:00 (UTC 02:00 / KST 11:00) — 不重新抓取，仅把同份数据推给 A 正式群
  # 韩国股市收盘时间为 KST 15:30，17:00 北京(=18:00 KST) 抓取可确保数据已完整录入。
  # 可通过 client_payload 控制：
  #   phase='preview'  → update 照常 + 推 B
  #   phase='final'    → update 跳过 + 仅推 A
  #   无 phase         → 兼容旧行为（update + 推 A）
  #   force_notify=true → 忽略每日去重强制推送
  repository_dispatch:
    types: [trigger-update]

  # 手动触发（保留，用于调试）
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制推送企微通知（忽略每日去重）'
        required: false
        type: boolean
        default: false
      skip_notify:
        description: '本次不推送企微通知（仅更新数据+部署页面，调试时勾选）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-stock-update"
  cancel-in-progress: true

jobs:
  # ====== 数据更新+验证+部署 ======
  update:
    # final 阶段（次日10点推A）不需要重新抓取/部署，由 17点 preview 阶段已完成；
    # preview / 无 phase / workflow_dispatch 均正常运行抓取。
    if: |
      github.event.client_payload.phase != 'final' &&
      (github.event.action == 'trigger-update' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run data fetcher
        run: node scripts/fetch-data.mjs

      # ====== 新闻抓取（AI 翻译为中文，追加模式不覆盖人工数据）======
      # 注意：不用 `|| echo` 静默吞掉失败——2026-06-30 曾因脚本语法错误导致此步骤
      # 静默失败超过3周未被发现（错误被吞掉，日志只显示"skipped"看起来像网络问题）。
      # 现改为：失败时仍写入 GitHub Step Summary 明确告警，但 continue-on-error 保证
      # 不阻断后续 commit/deploy（新闻抓取非关键路径，允许失败）。
      - name: Run news fetcher
        id: news-fetcher
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 可选：指向任意 OpenAI 兼容网关（DeepSeek / 通义千问 / 智谱 / Kimi / 混元等），
          # 未配置则默认走 https://api.openai.com/v1 + gpt-4o-mini
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/fetch-news.mjs

      - name: Warn if news fetcher failed
        if: steps.news-fetcher.outcome == 'failure'
        run: |
          echo "### ⚠️ 新闻抓取失败" >> "$GITHUB_STEP_SUMMARY"
          echo "fetch-news.mjs 本次运行失败，资讯数据未更新。请检查脚本是否存在语法错误或网络问题。" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::fetch-news.mjs failed — 资讯抓取未成功，请检查日志"

      # ====== 涨跌分析自动生成（基于真实涨跌幅+大盘异动+当日事件生成分析文本）======
      # 非关键路径：失败不阻断后续 commit/deploy；未配置 LLM Key 时自动使用规则引擎兜底。
      - name: Run analysis generator
        id: analysis-generator
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/generate-analysis.mjs

      - name: Warn if analysis generator failed
        if: steps.analysis-generator.outcome == 'failure'
        run: |
          echo "### ⚠️ 涨跌分析生成失败" >> "$GITHUB_STEP_SUMMARY"
          echo "generate-analysis.mjs 本次运行失败，analysis 字段未更新。请检查日志。" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::generate-analysis.mjs failed — 涨跌分析未成功生成，请检查日志"

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "📊 自动更新股价数据 $(date '+%Y-%m-%d %H:%M KST')"

            # 远程可能在本次运行期间被其他触发（如手动 rerun 与定时触发重叠）推送过新 commit，
            # 直接 push 会因 "fetch first" 被拒绝。这里加入 fetch+rebase 重试，
            # 最多尝试 3 次，避免因一次性的远程领先而导致整条流水线失败（2026-08-06 曾发生此问题）。
            push_ok=false
            for attempt in 1 2 3; do
              if git push; then
                echo "推送成功 (第 $attempt 次尝试)"
                push_ok=true
                break
              fi
              echo "推送被拒绝（远程有新提交），fetch + rebase 后重试..."
              git fetch origin main
              git rebase origin/main
              sleep 2
            done
            if [ "$push_ok" != "true" ]; then
              echo "::error::推送失败，已重试 3 次仍无法完成，请检查远程仓库状态"
              exit 1
            fi
          else
            echo "No data changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # ====== 部署到GitHub Pages（带重试机制）======
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # ====== final 阶段专属：重新部署网页（不重新抓取）======
  # 次日10点推A前，把 main 上"用户17点后手动修正的数据/面板"重新部署上线，
  # 保证 A 收到的网页链接与微信消息一致（均为修正后版本）。
  # preview/无phase 阶段已由 update job 部署过，此 job 跳过，避免重复部署。
  deploy-final:
    if: |
      github.event.client_payload.phase == 'final' &&
      (github.event.action == 'trigger-update' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout latest (含用户修正)
        uses: actions/checkout@v4
        with:
          ref: main  # 获取用户17点后手动推送的修正 commit

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # ====== 企业微信推送（update / deploy-final 完成后自动执行，每日仅1次）======
  # skip_notify=true 时整个 job 不执行——用于"只想更新数据/验证抓取链路，
  # 不想惊动企微群"的手动调试场景（每日去重缓存也不会被写入，不影响当天正常推送）。
  notify:
    needs: [update, deploy-final]
    if: |
      always() &&
      needs.update.result != 'failure' &&
      needs.deploy-final.result != 'failure' &&
      github.event.inputs.skip_notify != 'true' &&
      github.event.client_payload.skip_notify != true &&
      (github.event.action == 'trigger-update' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve force_notify flag
        id: resolve-force
        run: |
          # workflow_dispatch: inputs.force_notify
          # repository_dispatch: client_payload.force_notify
          FN="${{ github.event.inputs.force_notify }}"
          if [ "$FN" = "" ] || [ "$FN" = "false" ]; then
            FN="${{ github.event.client_payload.force_notify }}"
          fi
          echo "force_notify=${FN:-false}" >> "$GITHUB_OUTPUT"

      - name: Get today's date (KST)
        id: get-date
        run: echo "date=$(TZ=Asia/Seoul date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Check if already notified today
        id: notify-guard
        uses: actions/cache@v4
        with:
          path: /tmp/notify-sent
          # key 必须带 phase：preview(17点) 与 final(次日10点) 在同一 KST 日历日会共用同一日期，
          # 若不区分 phase，先跑的 final 会写缓存、导致后跑的 preview 被去重跳过（B 永远收不到预览）。
          key: notify-sent-${{ github.event.client_payload.phase || 'default' }}-${{ steps.get-date.outputs.date }}

      - name: Skip — already notified today
        if: >-
          steps.notify-guard.outputs.cache-hit == 'true' &&
          steps.resolve-force.outputs.force_notify != 'true'
        run: |
          echo "⏭️ 今日 (${{ steps.get-date.outputs.date }}) 已推送过，跳过（如需强制推送请勾选 force_notify 或传 client_payload.force_notify=true）"
          exit 0

      - name: Force notify — bypassing cache guard
        if: >-
          steps.notify-guard.outputs.cache-hit == 'true' &&
          steps.resolve-force.outputs.force_notify == 'true'
        run: |
          echo "🔄 force_notify=true，忽略缓存去重，强制推送"

      - name: Checkout latest data
        if: >-
          steps.notify-guard.outputs.cache-hit != 'true' ||
          steps.resolve-force.outputs.force_notify == 'true'
        uses: actions/checkout@v4
        with:
          ref: main  # 必须获取 update job 推送的最新 commit，而非触发时的旧 commit

      - name: Setup Node.js
        if: >-
          steps.notify-guard.outputs.cache-hit != 'true' ||
          steps.resolve-force.outputs.force_notify == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ====== 两阶段分流：preview(17点)→B 预览群；final/无phase(次日10点/手动)→A 正式群 ======
      # 两个 send 步骤按 client_payload.phase 选择 Webhook，B/A 文案完全一致（仅接收群不同）。
      - name: Send WeCom notification to B (preview phase)
        id: send-notify-b
        if: >-
          (steps.notify-guard.outputs.cache-hit != 'true' ||
           steps.resolve-force.outputs.force_notify == 'true') &&
          github.event.client_payload.phase == 'preview'
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL_B }}
          DASHBOARD_URL: 'https://nebula.stock-dashboard.com'
        run: node scripts/notify-wecom.mjs
        continue-on-error: true

      - name: Send WeCom notification to A (final / dispatch phase)
        id: send-notify
        if: >-
          (steps.notify-guard.outputs.cache-hit != 'true' ||
           steps.resolve-force.outputs.force_notify == 'true') &&
          github.event.client_payload.phase != 'preview'
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DASHBOARD_URL: 'https://nebula.stock-dashboard.com'
        run: node scripts/notify-wecom.mjs
        continue-on-error: true

      # continue-on-error 会让此步骤失败时 job 整体仍显示绿色✅，容易被忽略。
      # 显式写入告警，避免"推送失败但看起来一切正常"（2026-08-06 曾因 fetch failed 静默漏推）。
      - name: Warn if B notification failed
        if: steps.send-notify-b.outcome == 'failure'
        run: |
          echo "### 企业微信推送失败（B 预览群）" >> "$GITHUB_STEP_SUMMARY"
          echo "notify-wecom.mjs 本次运行失败（多次重试后仍无法送达），B 预览群消息未推送。请检查 WECOM_WEBHOOK_URL_B 是否有效或网络问题。" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::notify-wecom.mjs failed (B) — 企业微信通知未推送成功，请检查日志"

      - name: Warn if A notification failed
        if: steps.send-notify.outcome == 'failure'
        run: |
          echo "### 企业微信推送失败（A 正式群）" >> "$GITHUB_STEP_SUMMARY"
          echo "notify-wecom.mjs 本次运行失败（多次重试后仍无法送达），A 正式群消息未推送。请检查 WECOM_WEBHOOK_URL 是否有效或网络问题。" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::notify-wecom.mjs failed (A) — 企业微信通知未推送成功，请检查日志"
