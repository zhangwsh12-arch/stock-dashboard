name: Daily Stock Data Update

on:
  # ====== 外部定时触发（cron-job.org 精准触发，无延迟）======
  repository_dispatch:
    types: [trigger-update, trigger-notify]

  # 手动触发（保留，用于调试）
  workflow_dispatch:

  # 兜底：GitHub schedule（可能延迟 5-30 分钟）
  schedule:
    - cron: '30 1 * * 1-5'    # UTC 01:30 = KST 10:30，兜底数据更新
    - cron: '30 2 * * 1-5'    # UTC 02:30 = KST 11:30，兜底推送

  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ====== 数据更新+验证+部署 ======
  # 触发条件：trigger-update / workflow_dispatch / 兜底schedule / push
  update:
    if: |
      github.event.action == 'trigger-update' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.schedule == '30 1 * * 1-5'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run data fetcher
        run: node scripts/fetch-data.mjs

      # ====== 新闻抓取已禁用（韩语新闻导致界面显示问题）======
      # - name: Run news fetcher
      #   run: node scripts/fetch-news.mjs || echo "News fetcher skipped (may have network issues)"

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "📊 自动更新股价数据 $(date '+%Y-%m-%d %H:%M KST')"
            git push
          else
            echo "No data changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ====== 企业微信推送 ======
  # 触发条件：trigger-notify / 兜底schedule
  notify:
    if: |
      github.event.action == 'trigger-notify' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '30 2 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send WeCom notification
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DASHBOARD_URL: 'https://nebula.stock-dashboard.com'
        run: node scripts/notify-wecom.mjs
        continue-on-error: true
