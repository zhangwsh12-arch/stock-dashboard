name: Daily Stock Data Update

on:
  # ====== 外部定时触发（cron-job.org 精准触发，无延迟）======
  # 建议配置: 工作日 UTC 02:00 (北京时间 10:00 / 韩国时间 11:00)
  # 韩国股市收盘时间为 KST 15:30，11:00 推送可确保数据已完整录入
  repository_dispatch:
    types: [trigger-update]

  # 手动触发（保留，用于调试）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ====== 数据更新+验证+部署 ======
  update:
    if: |
      github.event.action == 'trigger-update' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run data fetcher
        run: node scripts/fetch-data.mjs

      # ====== 新闻抓取已禁用（韩语新闻导致界面显示问题）======
      # - name: Run news fetcher
      #   run: node scripts/fetch-news.mjs || echo "News fetcher skipped (may have network issues)"

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "📊 自动更新股价数据 $(date '+%Y-%m-%d %H:%M KST')"
            git push
          else
            echo "No data changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ====== 企业微信推送（update 完成后自动执行，每日仅1次）======
  notify:
    needs: update
    if: |
      always() &&
      needs.update.result == 'success' &&
      (github.event.action == 'trigger-update' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Get today's date (KST)
        id: get-date
        run: echo "date=$(TZ=Asia/Seoul date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Check if already notified today
        id: notify-guard
        uses: actions/cache@v4
        with:
          path: /tmp/notify-sent
          key: notify-sent-${{ steps.get-date.outputs.date }}

      - name: Skip — already notified today
        if: steps.notify-guard.outputs.cache-hit == 'true'
        run: |
          echo "⏭️ 今日 (${{ steps.get-date.outputs.date }}) 已推送过，跳过"
          exit 0

      - name: Checkout latest data
        if: steps.notify-guard.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: main  # 必须获取 update job 推送的最新 commit，而非触发时的旧 commit

      - name: Setup Node.js
        if: steps.notify-guard.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send WeCom notification
        if: steps.notify-guard.outputs.cache-hit != 'true'
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DASHBOARD_URL: 'https://nebula.stock-dashboard.com'
        run: node scripts/notify-wecom.mjs
        continue-on-error: true
