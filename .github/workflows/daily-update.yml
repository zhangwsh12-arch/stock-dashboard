name: Daily Stock Data Update

on:
  # ====== 外部定时触发（cron-job.org 精准触发，无延迟）======
  # 可通过 client_payload.force_notify=true 强制推送
  # 例: gh api repos/.../dispatches -f event_type=trigger-update -f '{"force_notify":true}'
  # 建议配置: 工作日 UTC 02:00 (北京时间 10:00 / 韩国时间 11:00)
  # 韩国股市收盘时间为 KST 15:30，11:00 推送可确保数据已完整录入
  repository_dispatch:
    types: [trigger-update]

  # 手动触发（保留，用于调试）
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制推送企微通知（忽略每日去重）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-stock-update"
  cancel-in-progress: true

jobs:
  # ====== 数据更新+验证+部署 ======
  update:
    if: |
      github.event.action == 'trigger-update' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run data fetcher
        run: node scripts/fetch-data.mjs

      # ====== 新闻抓取（AI 翻译为中文，追加模式不覆盖人工数据）======
      # 注意：不用 `|| echo` 静默吞掉失败——2026-06-30 曾因脚本语法错误导致此步骤
      # 静默失败超过3周未被发现（错误被吞掉，日志只显示"skipped"看起来像网络问题）。
      # 现改为：失败时仍写入 GitHub Step Summary 明确告警，但 continue-on-error 保证
      # 不阻断后续 commit/deploy（新闻抓取非关键路径，允许失败）。
      - name: Run news fetcher
        id: news-fetcher
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/fetch-news.mjs

      - name: Warn if news fetcher failed
        if: steps.news-fetcher.outcome == 'failure'
        run: |
          echo "### ⚠️ 新闻抓取失败" >> "$GITHUB_STEP_SUMMARY"
          echo "fetch-news.mjs 本次运行失败，资讯数据未更新。请检查脚本是否存在语法错误或网络问题。" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::fetch-news.mjs failed — 资讯抓取未成功，请检查日志"

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "📊 自动更新股价数据 $(date '+%Y-%m-%d %H:%M KST')"
            git push
          else
            echo "No data changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # ====== 部署到GitHub Pages（带重试机制）======
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # ====== 企业微信推送（update 完成后自动执行，每日仅1次）======
  notify:
    needs: update
    if: |
      always() &&
      needs.update.result == 'success' &&
      (github.event.action == 'trigger-update' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve force_notify flag
        id: resolve-force
        run: |
          # workflow_dispatch: inputs.force_notify
          # repository_dispatch: client_payload.force_notify
          FN="${{ github.event.inputs.force_notify }}"
          if [ "$FN" = "" ] || [ "$FN" = "false" ]; then
            FN="${{ github.event.client_payload.force_notify }}"
          fi
          echo "force_notify=${FN:-false}" >> "$GITHUB_OUTPUT"

      - name: Get today's date (KST)
        id: get-date
        run: echo "date=$(TZ=Asia/Seoul date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Check if already notified today
        id: notify-guard
        uses: actions/cache@v4
        with:
          path: /tmp/notify-sent
          key: notify-sent-${{ steps.get-date.outputs.date }}

      - name: Skip — already notified today
        if: >-
          steps.notify-guard.outputs.cache-hit == 'true' &&
          steps.resolve-force.outputs.force_notify != 'true'
        run: |
          echo "⏭️ 今日 (${{ steps.get-date.outputs.date }}) 已推送过，跳过（如需强制推送请勾选 force_notify 或传 client_payload.force_notify=true）"
          exit 0

      - name: Force notify — bypassing cache guard
        if: >-
          steps.notify-guard.outputs.cache-hit == 'true' &&
          steps.resolve-force.outputs.force_notify == 'true'
        run: |
          echo "🔄 force_notify=true，忽略缓存去重，强制推送"

      - name: Checkout latest data
        if: >-
          steps.notify-guard.outputs.cache-hit != 'true' ||
          steps.resolve-force.outputs.force_notify == 'true'
        uses: actions/checkout@v4
        with:
          ref: main  # 必须获取 update job 推送的最新 commit，而非触发时的旧 commit

      - name: Setup Node.js
        if: >-
          steps.notify-guard.outputs.cache-hit != 'true' ||
          steps.resolve-force.outputs.force_notify == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send WeCom notification
        if: >-
          steps.notify-guard.outputs.cache-hit != 'true' ||
          steps.resolve-force.outputs.force_notify == 'true'
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DASHBOARD_URL: 'https://nebula.stock-dashboard.com'
        run: node scripts/notify-wecom.mjs
        continue-on-error: true
