name: Daily Stock Data Update

on:
  # ====== 定时触发 ======
  schedule:
    - cron: '0 1 * * 1-5'    # KST 10:00 数据更新+验证+部署
    - cron: '0 2 * * 1-5'    # KST 11:00 企业微信推送

  push:
    branches:
      - main
      
  # 手动触发（保留）
  workflow_dispatch:
  # 外部唤醒
  repository_dispatch:
    types: [trigger-update]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ====== KST 10:00 数据更新+验证+部署 ======
  update:
    if: github.event.schedule == '0 1 * * 1-5' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run data fetcher
        run: node scripts/fetch-data.mjs

      # ====== 新闻抓取已禁用（韩语新闻导致界面显示问题）======
      # - name: Run news fetcher
      #   run: node scripts/fetch-news.mjs || echo "News fetcher skipped (may have network issues)"

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "📊 自动更新股价数据 $(date '+%Y-%m-%d %H:%M KST')"
            git push
          else
            echo "No data changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ====== KST 11:00 企业微信推送 ======
  notify:
    if: github.event.schedule == '0 2 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send WeCom notification
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DASHBOARD_URL: 'https://nebula.stock-dashboard.com'
        run: node scripts/notify-wecom.mjs
        continue-on-error: true
